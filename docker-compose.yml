services:

  authservice:
    build: ./authservice
    container_name: authservice
    ports:
      - "8082:8080"
    networks:
      - app-network
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_EXPIRATION_MINS: ${ACCESS_EXPIRATION_MINS}
      REFRESH_EXPIRATION_MINS: ${REFRESH_EXPIRATION_MINS}
      USERSERVICE_URL: ${USERSERVICE_URL}
    depends_on:
      - auth-db

  auth-db:
    image: postgres:16
    container_name: authservice_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    networks:
      - app-network
    volumes:
      - auth_db_data:/var/lib/postgresql/data

volumes:
  auth_db_data:

networks:
  app-network:
    external: true